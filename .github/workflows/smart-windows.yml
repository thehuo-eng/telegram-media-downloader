name: Smart Downloader Windows
on:
  workflow_dispatch:
  push:
    branches: [codex/smart-downloader]
  pull_request:
    paths: ['src/**', 'tests/**', '*requirements*.txt', '*.spec']
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm TelegramSmartDownloader.spec
      - run: ./tools/verify_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramSmartDownloader-Windows-x64
          path: dist/TelegramSmartDownloader.exe
